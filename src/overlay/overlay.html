<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .svg-target {
      position: absolute;
      left: 0; top: 0;
      transform-origin: center;
    }
    .svg-target > svg { display: block; overflow: visible; }
  </style>
</head>
<body>
  <div id="primary" class="svg-target"><svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="-128 -128 256 256"></svg></div>
  <div id="secondary" class="svg-target"><svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="-128 -128 256 256"></svg></div>
  <script src="../shared/geometry.js"></script>
  <script src="../shared/layers.js"></script>
  <script src="../shared/game-state.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
