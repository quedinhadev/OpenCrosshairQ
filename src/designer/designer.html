<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
  <title>OpenCrosshairQ — Criador</title>
  <style>
    /* Tokens medidos na UI do criador (amostragem de pixels + DOM vivo):
       fundo #1C1C1C, canvas #141414, painéis #1A1A1A/#1E1E1E, texto #B3B3B3,
       laranja #FF8000, seleção #3B82F6, tema de animação #2FC787, raio 5–8px. */
    :root {
      color-scheme: dark;
      --bg: #1c1c1c; --canvas: #141414; --panel: #1a1a1a; --raise: #1e1e1e;
      --field: rgba(255,255,255,.08); --field-soft: rgba(255,255,255,.024); --hover: rgba(255,255,255,.04);
      --txt: #b3b3b3; --txt-strong: #fff; --txt-dim: rgba(255,255,255,.5);
      --accent: #2f6bff; --accent-soft: rgba(47,107,255,.2);
      --sel: #3b82f6; --sel-dim: rgba(59,130,246,.35);
      --green: #2fc787; --green-soft: rgba(47,199,135,.06); --green-line: rgba(47,199,135,.15);
      --radius: 6px; --radius-lg: 8px; --radius-in: 5px;
      --motion-dur-hover: 100ms;
      --motion-dur-press: 130ms;
      --motion-dur-modal: 200ms;
      --motion-ease-std: cubic-bezier(0.2, 0, 0, 1);
      --motion-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --motion-ease-in: cubic-bezier(0.4, 0, 1, 1);
      font-family: Inter, 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--txt); font: 13px/1.45 Inter, 'Segoe UI', system-ui, sans-serif; overflow: hidden; user-select: none; }
    svg { display: block; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 6px; }
    input, select { font: inherit; color: var(--txt); background: none; border: none; outline: none; }
    ::placeholder { color: var(--txt-dim); }

    #root-page { display: flex; height: 100vh; }
    #main { position: relative; flex: 1; min-width: 0; }
    #canvas { position: absolute; inset: 0; background: var(--canvas); }

    /* ---------- barra de ferramenta do topo (dtb) ---------- */
    #dtb { position: absolute; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; z-index: 5; background: var(--panel); border-bottom: 1px solid #262626; overflow: hidden; }
    #dtb > button { flex-shrink: 0; }
    #dtb .dtb-name { min-width: 80px; flex: 0 1 220px; }
    #dtb .dtb-label { display: none; }
    .dtb-name { display: flex; align-items: center; gap: 6px; height: 26px; width: 220px; padding: 0 9px; background: rgba(255,255,255,.03); border-radius: var(--radius-in); }
    .dtb-name .icon { color: var(--txt-dim); }
    #docName { flex: 1; min-width: 0; font-size: 12px; color: var(--txt-strong); }
    .dtb-btn {
      height: 26px; padding: 0 11px; border-radius: var(--radius-in); background: rgba(255,255,255,.05); color: rgba(255,255,255,.72); font-size: 11px; display: inline-flex; align-items: center; gap: 6px;
      transition: background-color var(--motion-dur-hover) var(--motion-ease-std), color var(--motion-dur-hover) var(--motion-ease-std), transform var(--motion-dur-press) var(--motion-ease-out);
    }
    .dtb-btn:hover { background: var(--hover); color: var(--txt-strong); }
    .dtb-btn:active { transform: scale(0.97); }
    .dtb-ghost { background: none; color: var(--txt); }
    .dtb-ghost:hover { background: var(--hover); }
    .dtb-primary {
      background: rgba(59,130,246,.14); color: #7fb0ff; font-weight: 600;
      transition: background-color var(--motion-dur-hover) var(--motion-ease-std), color var(--motion-dur-hover) var(--motion-ease-std), transform var(--motion-dur-press) var(--motion-ease-out);
    }
    .dtb-primary .icon { color: #7fb0ff; }
    .dtb-primary:hover { background: rgba(59,130,246,.22); color: #a8c8ff; }
    .dtb-primary:active { transform: scale(0.97); }
    .dtb-sep { width: 1px; height: 18px; background: rgba(255,255,255,.08); margin: 0 4px; }
    .dtb-icon {
      width: 26px; height: 26px; border-radius: var(--radius-in); align-items: center; justify-content: center; color: var(--txt);
      transition: background-color var(--motion-dur-hover) var(--motion-ease-std), color var(--motion-dur-hover) var(--motion-ease-std), transform var(--motion-dur-press) var(--motion-ease-out);
    }
    .dtb-icon:hover { background: var(--hover); }
    .dtb-icon:active:not(:disabled) { transform: scale(0.92); }
    .dtb-icon:disabled { opacity: .3; cursor: default; background: none; }
    .dtb-flex { flex: 1; }
    .dtb-label { color: var(--txt-strong); font-weight: 600; padding: 0 8px; white-space: nowrap; }
    .dtb-active-pill { display: inline-flex; align-items: center; background: var(--field-soft); border-radius: 999px; padding: 3px; }
    .mode-tab {
      height: 24px; padding: 0 12px; border-radius: 999px; color: var(--txt-dim); font-weight: 600;
      transition: background-color var(--motion-dur-hover) var(--motion-ease-std), color var(--motion-dur-hover) var(--motion-ease-std);
    }
    .mode-tab.active { background: var(--accent-soft); color: var(--accent); }
    body.mode-animar .mode-tab.active { background: var(--green-line); color: var(--green); }
    #docStatus { font-size: 11px; color: var(--txt-dim); position: absolute; top: 40px; left: 44px; }

    #arqMenu { position: absolute; top: 38px; left: 10px; z-index: 30; background: var(--raise); border: 1px solid rgba(255,255,255,.08); border-radius: var(--radius-lg); padding: 6px; min-width: 190px; box-shadow: 0 12px 32px rgba(0,0,0,.5); display: none; }
    #arqMenu.open {
      display: block;
      animation: menuIn 120ms var(--motion-ease-out) forwards;
    }
    @keyframes menuIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    #arqMenu .menu-item {
      display: flex; width: 100%; height: 32px; padding: 0 10px; border-radius: var(--radius-in); color: var(--txt);
      transition: background-color var(--motion-dur-hover) var(--motion-ease-std), color var(--motion-dur-hover) var(--motion-ease-std);
    }
    #arqMenu .menu-item:hover { background: var(--hover); color: var(--txt-strong); }

    /* ---------- gaveta de camadas (flutuante) ---------- */
    #drawer { position: absolute; top: 49px; left: 12px; width: 220px; z-index: 4; background: rgba(22,22,22,.92); border: 1px solid rgba(255,255,255,.05); border-radius: 10px; padding: 0; overflow: hidden; }
    #drawerHead { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 11px; background: var(--panel); color: var(--txt-strong); cursor: pointer; }
    #drawerHead .count { font-size: 11px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--field); display: inline-flex; align-items: center; justify-content: center; color: var(--txt); }
    #drawerHead .chev { margin-left: auto; color: var(--txt-dim); transition: transform .15s; }
    #drawer.closed #layers, #drawer.closed #addModel, #drawer.closed #drawerHead .chev { display: none; }
    #drawer.closed { background: var(--panel); }
    #drawer:not(.closed) #layers,
    #drawer:not(.closed) #addModel {
      animation: drawerFadeIn 140ms var(--motion-ease-out);
    }
    @keyframes drawerFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    #layers { list-style: none; margin: 0; padding: 4px 5px; background: var(--panel); max-height: 320px; overflow-y: auto; }
    #layers li {
      display: flex; align-items: center; gap: 9px; height: 44px; border-radius: 5px; padding: 0 8px 0 7px; cursor: pointer;
      transition: background-color var(--motion-dur-hover) var(--motion-ease-std), outline-color var(--motion-dur-hover) var(--motion-ease-std);
    }
    #layers li:hover { background: var(--hover); }
    #layers li.sel { background: rgba(255,255,255,.1); outline: 1px solid rgba(255,255,255,.18); }
    #layers .thumb { width: 22px; height: 22px; border-radius: 4px; background: var(--field); display: flex; align-items: center; justify-content: center; }
    #layers .name { flex: 1; color: var(--txt-strong); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #layers .lbtn { color: var(--txt-dim); font-size: 10px; padding: 2px 4px; border-radius: 4px; }
    #layers .lbtn:hover { background: var(--hover); color: var(--txt-strong); }
    #layers li.off .thumb, #layers li.off .name { opacity: .35; }
    body.mode-animar #layers li.sel { background: var(--green-soft); outline-color: var(--green-line); }
    #addModel {
      width: calc(100% - 10px); height: 34px; margin: 4px 5px 5px; border: 1px dashed rgba(255,255,255,.14); border-radius: var(--radius-in);
      justify-content: center; color: var(--txt); gap: 8px; font-size: 11px;
      transition: background-color var(--motion-dur-hover) var(--motion-ease-std), border-color var(--motion-dur-hover) var(--motion-ease-std), color var(--motion-dur-hover) var(--motion-ease-std), transform var(--motion-dur-press) var(--motion-ease-out);
    }
    #addModel:hover { background: var(--hover); color: var(--txt-strong); border-color: rgba(255,255,255,.24); }
    #addModel:active { transform: scale(0.98); }

    /* ---------- canvas + seleção ---------- */
    #stageWrap { position: absolute; inset: 0; overflow: hidden; }
    #stageInner { position: absolute; inset: 0; transform-origin: 50% 50%; }
    #stage { position: absolute; inset: 0; }
    #stage .grid { position: absolute; inset: 0;
      background-image: linear-gradient(#222 1px, transparent 1px), linear-gradient(90deg, #222 1px, transparent 1px);
      background-size: 50px 50px; background-position: center; }
    #stage .axis-h { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(255,255,255,.08); }
    #stage .axis-v { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(255,255,255,.08); }
    #preview { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 50%; }
    #selBox { position: absolute; display: none; border: 1px solid var(--sel); box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; }
    #selBox .h { pointer-events: auto; }
    #preview { overflow: visible; }
    .sec-head::before { content: '⌄'; font-size: 11px; color: var(--txt-dim); }
    .sec.closed .sec-head::before { content: '›'; }
    button:focus-visible, [role=button]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    body.mode-animar #selBox { border-color: var(--green); }
    #selBox .h { position: absolute; width: 7px; height: 7px; background: var(--txt-strong); border: 0; border-radius: 1px; transform: translate(-50%, -50%); }
    #selBox .h.nw { left: 0; top: 0; } #selBox .h.n { left: 50%; top: 0; } #selBox .h.ne { left: 100%; top: 0; }
    #selBox .h.w { left: 0; top: 50%; } #selBox .h.e { left: 100%; top: 50%; }
    #selBox .h.sw { left: 0; top: 100%; } #selBox .h.s { left: 50%; top: 100%; } #selBox .h.se { left: 100%; top: 100%; }
    #selName { position: absolute; left: 0; top: 0; transform: translateY(calc(-100% - 4px)); background: var(--sel); color: var(--txt-strong); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
    body.mode-animar #selName { background: var(--green); color: #06251a; }
    #selSize { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 6px); background: var(--panel); color: var(--txt-strong); font: 600 10px/1 'Consolas', monospace; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
    body.mode-animar #selSize { color: var(--green); }
    #zoomBadge { position: absolute; left: 16px; bottom: 14px; font-size: 10px; color: var(--txt-dim); border-bottom: 1px solid var(--txt-dim); padding-bottom: 1px; z-index: 3; }
    body.dragging * { cursor: grabbing !important; }
    body.dragging #selBox { pointer-events: none; }

    /* ---------- barra flutuante inferior (fcb) ---------- */
    #fcb { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 5; width: 508px; max-width: calc(100% - 24px); height: 48px; background: var(--panel); border: 1px solid #2c2c2c; border-radius: 10px; padding: 5px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    #fcb .dtb-active-pill { height: 36px; border-radius: 6px; padding: 2px; gap: 2px; }
    #fcb .mode-tab { height: 32px; border-radius: 5px; }
    #fcb .fcb-tool { flex-shrink: 0; }
    body.mode-animar #fcb { border-color: var(--green-line); }
    .fcb-tool {
      width: 32px; height: 32px; border-radius: 6px; align-items: center; justify-content: center; color: rgba(255,255,255,.55);
      transition: background-color var(--motion-dur-hover) var(--motion-ease-std), color var(--motion-dur-hover) var(--motion-ease-std), transform var(--motion-dur-press) var(--motion-ease-out);
    }
    .fcb-tool:hover { background: var(--hover); color: var(--txt-strong); }
    .fcb-tool:active:not(:disabled) { transform: scale(0.92); }
    body.mode-animar .fcb-tool { color: rgba(255,255,255,.5); }
    body.mode-animar .fcb-tool:hover { background: var(--green-soft); color: var(--green); }
    .fcb-tool .chev { margin-left: -2px; }
    .fcb-sep { width: 1px; height: 22px; background: rgba(255,255,255,.09); margin: 0 5px; }
    .fcb-hint { font-size: 9px; color: rgba(255,255,255,.2); background: rgba(255,255,255,.03); border-radius: 50%; width: 17px; height: 15px; display: inline-flex; align-items: center; justify-content: center; }

    /* ---------- painel direito ---------- */
    #right { width: 300px; flex-shrink: 0; background: var(--panel); border-left: 1px solid rgba(255,255,255,.05); display: flex; flex-direction: column; height: 100vh; }
    #rpScroll { flex: 1; overflow-y: auto; scrollbar-width: thin; }
    #rpHead { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 14px; }
    #layerTitle { color: var(--txt-strong); font-weight: 600; }
    #rpHead .spacer { flex: 1; }
    .rp-icon {
      width: 24px; height: 24px; border-radius: var(--radius-in); align-items: center; justify-content: center; color: var(--txt);
      transition: background-color var(--motion-dur-hover) var(--motion-ease-std), transform var(--motion-dur-press) var(--motion-ease-out);
    }
    .rp-icon:hover { background: var(--hover); }
    .rp-icon:active:not(:disabled) { transform: scale(0.92); }
    #zoomRow { display: flex; align-items: center; gap: 10px; padding: 2px 16px 12px; color: var(--txt); }
    #zoomRow svg { color: var(--txt-dim); }
    #zoomRange { flex: 1; accent-color: var(--accent); }
    body.mode-animar #zoomRange { accent-color: var(--green); }
    #zoomVal { min-width: 34px; text-align: right; color: var(--txt-strong); font-size: 12.5px; }

    .sec { border-bottom: 1px solid rgba(255,255,255,.05); padding: 0 10px 10px; }
    .sec-head {
      display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 6px; margin: 0 -6px; border-radius: var(--radius-in); cursor: pointer;
      transition: background-color var(--motion-dur-hover) var(--motion-ease-std);
    }
    .sec-head:hover { background: var(--hover); }
    .sec-title { font-size: 12px; font-weight: 700; letter-spacing: .6px; color: var(--txt-strong); text-transform: uppercase; }
    body.mode-animar .sec-title { color: var(--green); }
    .sec-head .act {
      margin-left: auto; color: var(--txt-dim); width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 4px;
      transition: background-color var(--motion-dur-hover) var(--motion-ease-std), color var(--motion-dur-hover) var(--motion-ease-std);
    }
    .sec-head .act:hover { color: var(--txt-strong); background: var(--field); }
    .sec.closed .sec-body { display: none; }
    .sec[data-dim="1"] .sec-body { opacity: .45; }
    .sec-note { font-size: 11px; color: var(--txt-dim); padding: 2px 6px 0; }

    .frow { display: flex; flex-direction: column; align-items: stretch; gap: 6px; margin: 8px 2px; min-width: 0; }
    .frow > label.fl { color: rgba(255,255,255,.4); font-size: 11px; font-weight: 500; }
    .frow:has(.switchm) { flex-direction: row; align-items: center; justify-content: space-between; }
    .grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px 8px; margin: 8px 2px; }
    .grid2 > .frow { margin: 0; }
    .fl-block { color: var(--txt-dim); font-size: 12px; margin: 12px 6px 4px; }

    .nfield { display: flex; align-items: center; gap: 6px; height: 36px; padding: 5px 8px; background: var(--field-soft); border-radius: 6px; cursor: ew-resize; position: relative; min-width: 0; }
    .nfield input[type=number] { min-width: 0; }
    .nfield:hover { background: rgba(255,255,255,.1); }
    .nfield:focus-within { outline: 1px solid rgba(255,255,255,.25); }
    .nfield .ic { color: var(--txt-dim); flex-shrink: 0; pointer-events: none; }
    .nfield input[type=number] { width: 100%; background: none; text-align: right; color: var(--txt-strong); font-weight: 600; -moz-appearance: textfield; }
    .nfield input::-webkit-outer-spin-button, .nfield input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    select.fselNative { appearance: none; width: 100%; height: 34px; padding: 0 10px; background: var(--field); border-radius: var(--radius-in); cursor: pointer; color: var(--txt-strong); }
    select.fselNative option { background: var(--panel); }

    .crow { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 9px; background: var(--field); border-radius: var(--radius-in); }
    .crow .swatch { position: relative; width: 18px; height: 18px; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); flex-shrink: 0; }
    .crow .swatch input { position: absolute; inset: -4px; width: 26px; height: 26px; padding: 0; cursor: pointer; }
    .crow input.hex { width: 90px; color: var(--txt-strong); font-size: 12.5px; }
    .crow .divv { width: 1px; height: 16px; background: rgba(255,255,255,.14); margin-left: auto; }
    .crow .op { font-size: 12.5px; color: var(--txt); min-width: 40px; text-align: right; background: none; border: none; outline: none; font: inherit; width: 48px; }
    #apMs { background: linear-gradient(var(--green-line), var(--green-line)) no-repeat; padding: 0 4px; }
    #fcbDesign, #fcbAnimate { display: inline-flex; align-items: center; gap: 6px; }
    #fcbAnimate { display: none; }
    body.mode-animar #fcbDesign { display: none; }
    body.mode-animar #fcbAnimate { display: inline-flex; }
    #fcbAnimate [aria-pressed="true"] { color: var(--green); background: var(--green-soft); }
    #layers input.name { width: 0; cursor: default; }
    #layers input.name:not([readonly]) { cursor: text; user-select: text; }
    #layers li:focus-visible, #layers input.name:focus-visible, #fcb button:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
    #layerTitleSide { background: none; border: none; color: var(--txt-strong); font-size: 13px; font-weight: 600; min-width: 0; flex: 1; }

    .switchm { position: relative; width: 34px; height: 20px; flex-shrink: 0; }
    .switchm input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
    .switchm .t { position: absolute; inset: 0; background: var(--field); border-radius: 999px; transition: background .15s; }
    .switchm .t::before { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .switchm input:checked + .t { background: var(--accent); }
    .switchm input:checked + .t::before { transform: translateX(14px); }
    body.mode-animar .switchm input:checked + .t { background: var(--green); }
    .chkrow .fl { cursor: pointer; }

    /* ---------- painel de animação (tema verde) ---------- */
    #animPanel { padding: 4px 10px 12px; }
    .ap-head { color: var(--green); font-weight: 700; display: flex; align-items: center; gap: 8px; margin: 8px 6px 10px; }
    .ap-field { display: flex; align-items: center; gap: 8px; margin: 6px; }
    .ap-field > label.fl { width: 76px; flex-shrink: 0; }
    .ap-card { background: var(--green-soft); border: 1px solid var(--green-line); border-radius: var(--radius); padding: 10px; margin: 10px 6px; }
    .ap-card .hd { display: flex; align-items: center; gap: 8px; color: var(--txt-strong); font-weight: 600; }
    .ap-card .n { width: 20px; height: 20px; border-radius: 4px; background: var(--green-line); color: var(--green); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; }
    .ap-card .hd .ms { margin-left: auto; font-size: 11px; color: var(--green); font-variant-numeric: tabular-nums; }
    .ap-card .lbl { color: var(--txt-dim); font-size: 12px; margin: 10px 0 5px; }
    .ap-foot { display: flex; align-items: center; gap: 8px; color: var(--txt-dim); font-size: 12px; margin: 12px 2px 0; }
    .ap-foot .ms { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--green); }
    #stageAdd {
      width: calc(100% - 12px); margin: 2px 6px 0; height: 34px; border: 1px dashed var(--green-line); border-radius: var(--radius); color: var(--green); justify-content: center; gap: 8px;
      transition: background-color var(--motion-dur-hover) var(--motion-ease-std), border-color var(--motion-dur-hover) var(--motion-ease-std), color var(--motion-dur-hover) var(--motion-ease-std), transform var(--motion-dur-press) var(--motion-ease-out);
    }
    #stageAdd:hover:not(:disabled) { background: var(--green-soft); }
    #stageAdd:active:not(:disabled) { transform: scale(0.98); }
    #stageAdd:disabled { opacity: .45; cursor: default; }
    body.mode-animar #animPanel {
      display: block;
      animation: panelFadeIn 180ms var(--motion-ease-out) forwards;
    }
    @keyframes panelFadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    #animPanel { display: none; position: fixed; top: 48px; right: 312px; width: 260px; max-height: calc(100vh - 116px); overflow-y: auto; z-index: 6; background: #1a1a1a; border: 1px solid var(--green-line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }

    /* ---------- modais ---------- */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal:not([style*="none"]) {
      animation: modalBackdropFade var(--motion-dur-modal) var(--motion-ease-out) forwards;
    }
    .modal:not([style*="none"]) .modal-content {
      animation: modalCenterZoom var(--motion-dur-modal) var(--motion-ease-out) forwards;
      will-change: opacity, transform;
    }
    @keyframes modalBackdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes modalCenterZoom {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .modal-content { background: var(--panel); border: 1px solid rgba(255,255,255,.08); border-radius: var(--radius-lg); padding: 16px; width: min(700px, 92vw); max-height: 90vh; overflow-y: auto; color: var(--txt); }
    .modal-content h2 { font-size: 13px; margin: 0 0 10px; color: var(--txt-strong); }
    .modal-content canvas { cursor: crosshair; border-radius: var(--radius); background: var(--canvas); }
    .mrow { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    .mrow select, .mrow input[type=range] { flex: 1; }
    .mbtn {
      height: 32px; padding: 0 14px; background: var(--field); border-radius: var(--radius); color: var(--txt);
      transition: background-color var(--motion-dur-hover) var(--motion-ease-std), color var(--motion-dur-hover) var(--motion-ease-std), transform var(--motion-dur-press) var(--motion-ease-out);
    }
    .mbtn:hover { background: rgba(255,255,255,.1); }
    .mbtn:active:not(:disabled) { transform: scale(0.97); }
    .mbtn.primary { background: var(--accent); color: #1a0d00; font-weight: 600; }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      #arqMenu.open,
      body.mode-animar #animPanel,
      .modal:not([style*="none"]),
      .modal:not([style*="none"]) .modal-content,
      #drawer:not(.closed) #layers,
      #drawer:not(.closed) #addModel {
        opacity: 1 !important;
        transform: none !important;
      }
      #fcb {
        transform: translateX(-50%) !important;
      }
      #selSize {
        transform: translate(-50%, 6px) !important;
      }
      #selName {
        transform: translateY(calc(-100% - 4px)) !important;
      }
      #selBox .h {
        transform: translate(-50%, -50%) !important;
      }
      .switchm input:checked + .t::before {
        transform: translateX(14px) !important;
      }
    }
  </style>
  <link rel="stylesheet" href="rework.css">
</head>
<body>
  <div id="root-page">
    <div id="main">
      <div id="canvas"></div>

      <!-- barra superior do criador -->
      <div id="dtb">
        <div class="dtb-name" title="Nome da mira">
          <span class="icon" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span>
          <input id="docName" value="Sem Título" spellcheck="false">
        </div>
        <button class="dtb-btn" id="btnArquivo" aria-haspopup="true">Arquivo
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="dtb-primary" id="btnShare">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5h14v-5"/></svg>
          Compartilhar</button>
        <button class="dtb-btn dtb-ghost" id="btnSave">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v13a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
          Salvar</button>
        <span class="dtb-flex"></span>
        <button class="dtb-icon" id="undoBtn" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v1"/></svg></button>
        <button class="dtb-icon" id="redoBtn" title="Refazer (Ctrl+Y)" aria-label="Refazer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0-6 6v1"/></svg></button>
        <span class="dtb-sep"></span>
        <button class="dtb-icon" id="btnUp" title="Subir camada" aria-label="Subir camada"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 5-5 5 5"/><path d="m7 19 5-5 5 5"/></svg></button>
        <button class="dtb-icon" id="btnDown" title="Descer camada" aria-label="Descer camada"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 13 5 5 5-5"/><path d="m7 5 5 5 5-5"/></svg></button>
        <button class="dtb-icon" id="btnDel" title="Apagar camada" aria-label="Apagar camada"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0v14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6"/></svg></button>
        <span class="dtb-sep"></span>
        <span id="layerTitle" class="dtb-label">Mira 1</span>
      </div>
      <span id="docStatus" role="status"></span>

      <!-- menu Arquivo -->
      <div id="arqMenu" role="menu">
        <button class="menu-item" data-act="model">Nova Camada (Mira)</button>
        <button class="menu-item" data-act="shape">Forma</button>
        <button class="menu-item" data-act="text">Texto</button>
        <button class="menu-item" data-act="image">Importar Imagem</button>
        <button class="menu-item" data-act="draw">Desenho Livre</button>
        <button class="menu-item" data-act="cut">Recortar</button>
      </div>

      <!-- gaveta flutuante de camadas -->
      <div id="drawer">
        <div id="drawerHead" title="Recolher/abrir">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 8 9-4-9-4-9 4 9 4Z"/><path d="m3 12 9 4 9-4"/><path d="m3 16 9 4 9-4"/></svg>
          <span>Camadas</span><span class="count" id="layerCount">0</span>
          <span class="chev"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span>
        </div>
        <ul id="layers"></ul>
        <button id="addModel" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Nova Camada</button>
      </div>

      <!-- canvas -->
      <div id="stageWrap">
        <div id="stageInner">
          <div id="stage">
            <div class="grid"></div><div class="axis-h"></div><div class="axis-v"></div>
            <svg id="preview" viewBox="-30 -30 60 60" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
          <div id="selBox">
            <div id="selName">Mira 1</div>
            <div id="selSize">6 x 6 px</div>
            <i class="h nw"></i><i class="h n"></i><i class="h ne"></i><i class="h w"></i><i class="h e"></i><i class="h sw"></i><i class="h s"></i><i class="h se"></i>
          </div>
        </div>
      </div>
      <div id="zoomBadge">1px</div>

      <!-- barra flutuante inferior -->
      <div id="fcb">
        <span id="fcbDesign">
        <button class="fcb-tool" id="toolSelect" title="Adicionar mira" aria-label="Adicionar mira">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v6m0 8v6M2 12h6m8 0h6"/><circle cx="12" cy="12" r="2"/></svg></button>
        <button class="fcb-tool" id="addImage" title="Imagem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m5 19 6-6 3 3 3-3 3 3"/></svg></button>
        <button class="fcb-tool" id="addShape" title="Forma">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="6" width="15" height="12" rx="1.5"/></svg>
          <svg class="chev" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 10 6 6 6-6"/></svg></button>
        <button class="fcb-tool" id="addDraw" title="Desenho livre">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
        <button class="fcb-tool" id="addText" title="Texto">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16m-3 0h6"/></svg></button>
        </span>
        <span id="fcbAnimate" aria-label="Prévia de animação">
          <button type="button" class="fcb-tool" id="previewAutoplay" aria-label="Autoplay" title="Autoplay (1)" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/></svg></button>
          <button type="button" class="fcb-tool" id="previewFire" aria-label="Atirar" title="Atirar (2)" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 2 6 6-3-3 6 5 3-7 1-2 7-3-6-7 2 4-6-5-4 7 1Z"/></svg></button>
          <button type="button" class="fcb-tool" id="previewAim" aria-label="Mirar" title="Mirar (3)" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/><path d="M12 1v7m0 8v7M1 12h7m8 0h7"/></svg></button>
          <button type="button" class="fcb-tool" id="previewReload" aria-label="Recarregar" title="Recarregar: redefinir prévias com Soltar Pausar (4)" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10a8 8 0 1 0-2 8M20 3v7h-7"/></svg></button>
        </span>
        <span class="fcb-sep"></span>
        <span class="dtb-active-pill">
          <button class="mode-tab active" data-mode="design" type="button">Design</button>
          <button class="mode-tab" data-mode="animar" type="button">Animar</button>
        </span>
        <span class="fcb-hint" title="Alternar Design/Animar: S">S</span>
      </div>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
    </div>

    <!-- painel direito -->
    <aside id="right">
      <div id="rpHead">
        <input id="layerTitleSide" readonly value="Mira 1" aria-label="Nome da camada" title="Duplo clique para renomear">
        <span class="spacer"></span>
        <button class="rp-icon" id="rpDesign" title="Modo Design" aria-label="Modo design"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2 2 12l4 4 5 5 1.6-1.6L22 12 12 2Zm-4 12 4-4"/></svg></button>
        <button class="rp-icon" id="rpAnimar" title="Modo Animar" aria-label="Modo animar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 20-2-2 3-3 4 4-3 3-2-2Zm2-4 6-11 4 3-6 11"/><path d="m13 5 4 3"/></svg></button>
        <button class="rp-icon" id="btnClose" title="Fechar" aria-label="Fechar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div id="zoomRow">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M21 3l-7 7M9 21H3v-6M3 21l7-7"/></svg>
        <input type="range" id="zoomRange" min="0.25" max="4" step="0.05" value="1" aria-label="Zoom do canvas">
        <span id="zoomVal">1.0</span>
        <button id="realSize" class="rp-icon" title="Tamanho Real 1:1" aria-label="Tamanho real 1:1" style="font-size:11px;font-weight:600;padding:2px 4px;border-radius:var(--radius-in);background:var(--field);">1:1</button>
      </div>
      <div id="rpScroll">
        <div id="rpSections">
          <section class="sec" id="secLayer">
            <div class="sec-head"><span class="sec-title">Posição</span></div>
            <div class="sec-body" id="bodyLayer"></div>
          </section>
          <section class="sec" id="secLinhas">
            <div class="sec-head"><span class="sec-title">Linhas</span>
              <span class="act" id="lnAdd" title="Camada de adicionar" role="button"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></div>
            <div class="sec-body" id="bodyLinhas"></div>
            <p class="sec-note" id="lnNote"></p>
          </section>
          <section class="sec" id="secDot">
            <div class="sec-head"><span class="sec-title">Ponto central</span>
              <span class="act" id="dotClose" title="Fechar seção" role="button"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span></div>
            <div class="sec-body" id="bodyDot"></div>
          </section>
          <section class="sec" id="secOutline">
            <div class="sec-head"><span class="sec-title">Contorno</span>
              <span class="act" id="olClose" title="Fechar seção" role="button"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span></div>
            <div class="sec-body" id="bodyOutline"></div>
            <p class="sec-note" id="olNote"></p>
          </section>
        </div>

        <div id="animPanel">
          <div class="ap-head">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 20-2-2 3-3 4 4-3 3-2-2Zm2-4 6-11 4 3-6 11"/><path d="m13 5 4 3"/></svg>
            Animação
          </div>
          <div class="ap-field"><label class="fl" for="apTrigger">Gatilho</label>
            <select class="fselNative" id="apTrigger"><option value="none">Nada</option><option value="left">Atirar (botão esquerdo)</option><option value="right">Mirar (botão direito)</option><option value="autoplay">Autoplay</option></select></div>
          <div class="ap-field"><label class="fl" for="apPress">Ativação</label>
            <select class="fselNative" id="apPress"><option value="press">Pressionar</option><option value="hold">Manter</option></select></div>
          <div class="ap-field"><label class="fl" for="apRelease">Soltar</label>
            <select class="fselNative" id="apRelease"><option value="">Padrão</option><option value="reset">Redefinir</option><option value="pause">Pausar</option><option value="reverse">Reverter</option></select></div>
          <div class="ap-field"><label class="fl" for="apLoop">Loop</label>
            <select class="fselNative" id="apLoop"><option value="off">Desligado</option><option value="on">Ligado</option></select></div>
          <div class="ap-field"><label class="fl" for="apDir">Direção</label>
            <select class="fselNative" id="apDir"><option value="normal">Normal</option><option value="reverse">Reverso</option></select></div>
          <div class="ap-card">
            <div class="hd"><span class="n">0</span> Base <span class="ms" id="apMs">300ms</span></div>
            <div class="grid2" style="margin:0 0 0">
              <div><div class="lbl">Atraso (s)</div><div class="nfield"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 2h12M6 2v6a6 6 0 0 0 12 0V2M6 22h12M6 22v-6a6 6 0 0 1 12 0v6M12 15v1"/><path d="M17 8H7L6 2h12l-1 6ZM17 8a5 5 0 0 1-10 0"/></svg><input type="number" id="apDelay" min="0" max="60" step="0.01" value="0.00" aria-label="Atraso base (s)"></div></div>
              <div><div class="lbl">Duração (s)</div><div class="nfield"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><input type="number" id="apDur" min="0" max="60" step="0.01" value="0.30" aria-label="Duração base (s)"></div></div>
            </div>
            <label class="lbl" for="apEase">Suavização</label>
            <select class="fselNative" id="apEase"><option value="linear">Linear</option><option value="ease">Ease</option><option value="ease-in">Ease-in</option><option value="ease-out">Ease-out</option><option value="ease-in-out">Ease-in-out</option></select>
          </div>
          <button id="stageAdd" type="button" title="Adicionar estágio de animação">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Adicionar Estágio</button>
          <div class="ap-foot">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
            <span id="apFx">Sem efeitos</span><span class="ms" id="apTotalMs">300ms</span>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- modais -->
  <div id="modalDraw" class="modal" style="display:none">
    <div class="modal-content">
      <h2>Desenho livre</h2>
      <div class="mrow">
        <select id="drawTool"><option value="pen">Lápis</option><option value="eraser">Borracha</option></select>
        <input type="color" id="drawColor" value="#ffffff" style="width:38px; height:32px; background:none; border:none; padding:0">
        <input type="range" id="drawSize" min="1" max="24" step="1" value="4">
      </div>
      <div class="mrow" style="justify-content:center"><canvas id="drawCanvas" width="460" height="460"></canvas></div>
      <div class="mrow" style="justify-content:flex-end">
        <button class="mbtn" id="drawClear">Limpar</button>
        <button class="mbtn" id="drawCancel">Cancelar</button>
        <button class="mbtn primary" id="drawCommit">Adicionar</button>
      </div>
    </div>
  </div>
  <div id="modalCut" class="modal" style="display:none">
    <div class="modal-content">
      <h2>Recortar imagem</h2>
      <div class="mrow"><input type="file" id="cutFile" accept="image/*"></div>
      <div class="mrow"><canvas id="cutCanvas" width="700" height="700"></canvas></div>
      <div class="mrow">
        <input type="range" id="cutSize" min="20" max="700" step="10" value="300"><span id="cutSizeV" style="width:42px">300</span>
        <select id="cutShape"><option value="circle">Círculo</option><option value="square">Quadrado</option></select>
      </div>
      <div class="mrow" style="justify-content:flex-end">
        <button class="mbtn" id="cutCancel">Cancelar</button>
        <button class="mbtn primary" id="cutCommit">Recortar</button>
      </div>
    </div>
  </div>
  <script src="../shared/layers.js"></script>
  <script src="../shared/undoredo.js"></script>
  <script type="module" src="./designer.js"></script>
</body>
</html>
